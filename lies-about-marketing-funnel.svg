y/After sale service</text><polygon points="228,490 732,490 710,536 250,536" fill="#C9A44C"/><text x="480.0" y="519.0" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="500" font-size="17" fill="#1A1A1D">Retention</text><polygon points="250,540 710,540 688,586 272,586" fill="#C9A44C"/><text x="480.0" y="569.0" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="500" font-size="17" fill="#1A1A1D">Up-sell/Cross-sell</text><polygon points="272,590 688,590 666,636 294,636" fill="#C9A44C"/><text x="480.0" y="619.0" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="500" font-size="17" fill="#1A1A1D">Loyalty</text><polygon points="294,640 666,640 644,686 316,686" fill="#C9A44C"/><text x="480.0" y="669.0" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="500" font-size="17" fill="#1A1A1D">Ambassador-ship/ Advocacy</text>
